<body class="bg-background text-on-surface font-body-md antialiased flex flex-col min-h-screen">

<header class="bg-canvas border-b border-hairline sticky top-0 z-50">
  <div class="flex justify-between items-center h-20 px-gutter max-w-7xl mx-auto w-full">
    <a href="index.html" class="font-display-lg text-display-lg font-bold text-primary tracking-tight">잠실사랑공인중개사</a>

      <a href="news.html" class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors">부동산 뉴스</a>

<main class="flex-grow w-full max-w-6xl mx-auto px-margin-mobile md:px-gutter py-xl flex items-center justify-center">

  <div id="login-section" class="w-full max-w-md bg-canvas p-xl rounded-lg border border-hairline shadow-md hidden">
    <div class="text-center mb-lg">
      <span class="material-symbols-outlined text-[48px] text-primary mb-xs">lock</span>
      <h1 class="font-display-lg text-headline-md font-bold text-on-surface">관리자 로그인</h1>
      <p class="font-body-md text-on-surface-variant mt-xs">게시글 관리를 위해 비밀번호를 입력하세요.</p>
    </div>

    <form id="login-form" class="flex flex-col gap-md">
      <div class="flex flex-col gap-xs">
        <label for="password-input" class="font-headline-sm text-sm text-on-surface">비밀번호</label>
        <input type="password" id="password-input" required placeholder="비밀번호 입력" class="w-full px-md py-sm border border-outline-variant rounded focus:outline-none focus:border-primary text-body-md">
      </div>

      <div id="error-msg" class="hidden text-sm text-error bg-error/10 p-sm rounded text-center"></div>

      <button type="submit" class="w-full bg-primary text-on-primary font-action-md py-sm rounded hover:bg-primary/90 transition-colors">
        로그인
      </button>
    </form>
  </div>

  <div id="dashboard-section" class="w-full bg-canvas p-md md:p-xl rounded-lg border border-hairline shadow-sm hidden">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-md mb-lg border-b border-hairline pb-md">
      <div>
        <h1 class="font-display-lg text-headline-md md:text-display-lg text-on-surface font-bold">게시글 관리 대시보드</h1>
        <p class="font-body-md text-on-surface-variant mt-xs">등록된 게시글을 작성, 수정, 삭제할 수 있습니다.</p>
      </div>
      <div class="flex items-center gap-sm">
        <a href="news-write.html" class="inline-flex items-center gap-xs bg-primary text-on-primary font-action-md text-sm px-md py-sm rounded hover:bg-primary/90 transition-colors">
          <span class="material-symbols-outlined text-sm">add</span> 새 글 작성
        </a>
        <button id="logout-btn" class="inline-flex items-center gap-xs bg-surface-container text-on-surface-variant font-action-md text-sm px-md py-sm rounded hover:bg-surface-container-high transition-colors">
          <span class="material-symbols-outlined text-sm">logout</span> 로그아웃
        </button>
      </div>
    </div>

    <div class="overflow-x-auto border border-hairline rounded-lg">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-surface-container text-on-surface font-headline-sm text-sm border-b border-hairline">
            <th class="p-sm md:p-md w-16 text-center">번호</th>
            <th class="p-sm md:p-md w-28">카테고리</th>

            <th class="p-sm md:p-md w-32">작성일</th>
            <th class="p-sm md:p-md w-32 text-center">관리</th>
          </tr>
        </thead>
        <tbody id="posts-table-body" class="divide-y divide-hairline"></tbody>
      </table>
    </div>

    <div id="empty-msg" class="hidden py-xl text-center text-on-surface-variant font-body-lg">
      작성된 게시글이 없습니다.

<script src="db.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const loginSection = document.getElementById('login-section');
  const dashboardSection = document.getElementById('dashboard-section');
  const loginForm = document.getElementById('login-form');
  const errorMsg = document.getElementById('error-msg');
  const logoutBtn = document.getElementById('logout-btn');

  if (isAdmin()) {
    dashboardSection.classList.remove('hidden');
    renderPostsTable();
  } else {
    loginSection.classList.remove('hidden');
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.add('hidden');
    const inputPass = document.getElementById('password-input').value;
    const cfg = await loadConfig();
    const correctPass = cfg.admin_password || 'admin1234';

    if (inputPass === correctPass) {
      sessionStorage.setItem('isAdmin', 'true');
      window.location.reload();
    } else {
      errorMsg.textContent = '비밀번호가 올바르지 않습니다.';
      errorMsg.classList.remove('hidden');
    }
  });

  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem('isAdmin');
    window.location.reload();
  });
});

async function renderPostsTable() {
  const tbody = document.getElementById('posts-table-body');
  const emptyMsg = document.getElementById('empty-msg');
  const posts = await getPosts();

  if (!posts || posts.length === 0) {
    tbody.innerHTML = '';
    emptyMsg.classList.remove('hidden');
    return;
  }

  emptyMsg.classList.add('hidden');
  tbody.innerHTML = posts.map((post, index) => {
    return `
      <tr class="hover:bg-surface-container/30 transition-colors">
        <td class="p-sm md:p-md text-center text-caption text-on-surface-variant">${posts.length - index}</td>
        <td class="p-sm md:p-md">
          <span class="px-xs py-[2px] bg-primary/10 text-primary text-caption font-bold rounded">${escapeHtml(post.category || '뉴스')}</span>
        </td>
        <td class="p-sm md:p-md font-bold text-on-surface">
          <a href="news-detail.html?id=${post.id}" class="hover:text-primary transition-colors line-clamp-1">${escapeHtml(post.title)}</a>
        </td>
        <td class="p-sm md:p-md text-caption text-on-surface-variant whitespace-nowrap">${escapeHtml(post.date || '')}</td>
        <td class="p-sm md:p-md text-center whitespace-nowrap">
          <div class="inline-flex gap-xs">
            <a href="news-write.html?id=${post.id}" class="px-xs py-1 bg-surface-container-high text-on-surface rounded hover:bg-outline-variant transition-colors text-xs font-bold">수정</a>
            <button onclick="handleDelete('${post.id}')" class="px-xs py-1 bg-error/10 text-error rounded hover:bg-error/20 transition-colors text-xs font-bold">삭제</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

async function handleDelete(id) {
  if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
    await deletePost(id);
    renderPostsTable();
  }
}
</script>
